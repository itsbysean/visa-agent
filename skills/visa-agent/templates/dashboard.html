<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{name}} · {{title}}</title>
<style>
:root {
  font-family: system-ui, -apple-system, sans-serif;
  color: #232923;
  background: #f8f7f3;
  line-height: 1.55;
  --muted: #595f56;
  --green: #264c34;
  --line: #dedfd7;
  --paper: #fffefa;
  --soft: #f2f2eb;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1160px; margin-inline: auto; padding: 32px clamp(16px, 4vw, 44px); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.45rem); line-height: 1.18; font-weight: 650; }
h2 { font-size: 1.2rem; line-height: 1.35; }
h3 { font-size: 0.98rem; font-weight: 650; }
h1, h2, h3, p, li, .task-title, a { overflow-wrap: anywhere; }
.brand { display: inline-flex; gap: 6px; color: var(--green); font-weight: 700; margin-bottom: 24px; }
.case-meta { color: var(--muted); margin-block: 8px 24px; }
.layout { display: grid; gap: 24px; align-items: start; }
.checklist { min-width: 0; }
.overview {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr);
  border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
  margin-bottom: 24px;
}
.metric { padding: 14px 18px; }
.metric + .metric { border-inline-start: 1px solid var(--line); }
.metric-label, .metric-note { color: var(--muted); font-size: 0.82rem; }
.metric-value { color: var(--green); margin-block: 3px; font-size: clamp(1rem, 2vw, 1.32rem); font-weight: 700; }
.metric-note:empty { display: none; }
progress { display: block; width: 100%; height: 8px; margin-top: 8px; accent-color: var(--green); }
.hint { color: var(--muted); font-size: 0.85rem; margin-block: 5px 14px; }
.phase, .questions { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.phase + .phase { margin-top: 12px; }
.phase > h3, .archived > h2 {
  padding: 12px 16px; background: var(--soft);
  border-radius: 11px 11px 0 0;
}
.phase > h3::before {
  content: ""; display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: #718f65; margin-inline-end: 9px; vertical-align: 0.12em;
}
.task { border-top: 1px solid var(--line); }
.task-row {
  display: grid; grid-template-columns: 8px minmax(0, 1fr) minmax(5.5rem, auto) auto;
  align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; list-style: none;
}
.task-row::-webkit-details-marker { display: none; }
.task-row::before {
  content: ""; width: 6px; height: 6px; border-inline-end: 1.5px solid currentColor;
  border-block-end: 1.5px solid currentColor; transform: rotate(-45deg);
}
.task-row:dir(rtl)::before { transform: rotate(135deg); }
.task-details[open] > .task-row::before { transform: rotate(45deg); }
.task-row:hover { background: #f8f8f2; }
.task-row:focus-visible, a:focus-visible { outline: 2px solid #39664a; outline-offset: -2px; }
.task-title { font-size: 0.94rem; font-weight: 620; }
.task-date { font-size: 0.83rem; color: var(--muted); text-align: end; }
time { font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge {
  justify-self: end; padding: 3px 9px; border-radius: 999px;
  background: #edece8; color: #41453e; font-size: 0.76rem;
}
.done .badge { background: #e3efdf; color: #264d31; }
.in_progress .badge { background: #e5edf6; color: #254d6a; }
.needs_review .badge { background: #faeccd; color: #674909; }
.task-body {
  padding: 11px 14px; margin: 0 12px 12px; border-radius: 8px;
  background: var(--soft); font-size: 0.88rem;
}
.task-body > * + * { margin-top: 6px; }
.task-kind, small { color: var(--muted); }
.task-description, .task-body li { white-space: pre-wrap; }
ul { padding-inline-start: 1.25rem; }
a { color: var(--green); text-underline-offset: 3px; }
.questions h2 { padding: 13px 16px; background: #f0eee5; border-radius: 11px 11px 0 0; }
.questions ul { padding: 0 16px; margin: 0; list-style: none; }
.questions li { padding: 11px 0; font-size: 0.9rem; }
.questions li + li { border-top: 1px solid var(--line); }
.archived, .sources { margin-top: 24px; }
.sources li + li { margin-top: 8px; }
footer { margin-top: 24px; font-size: 0.8rem; color: var(--muted); }
@media (min-width: 860px) {
  .layout:has(.questions) { grid-template-columns: minmax(0, 1fr) minmax(220px, 29%); }
}
@media (max-width: 460px) {
  .metric { padding: 12px; }
  .task-row { grid-template-columns: 8px minmax(0, 1fr) fit-content(42%); gap: 5px 9px; padding: 10px 12px; }
  .task-row::before { grid-area: 1 / 1; }
  .task-title { grid-area: 1 / 2; }
  .task-date { grid-area: 2 / 2; text-align: start; }
  .badge { grid-area: 1 / 3 / 3; }
}
@media print {
  :root { background: white; }
  main { max-width: none; padding: 0; }
  .layout:has(.questions) { display: block; }
  .questions { margin-top: 16px; }
  .hint { display: none; }
  .task { break-inside: avoid; }
  .task-details::details-content { content-visibility: visible; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand" lang="en">Visa Agent <span aria-hidden="true">↗</span></div>
    <h1>{{title}}</h1>
    <p class="case-meta">{{name}} · {{destination}} · {{purpose}}</p>
  </header>
  <div class="layout">
    <div class="checklist">
      <div class="overview">
        <div class="metric">
          <p class="metric-label">{{deadline_label}}</p>
          <p class="metric-value">{{deadline}}</p>
          <p class="metric-note">{{deadline_kind}}</p>
        </div>
        <div class="metric">
          <p class="metric-label" id="progress-label">{{progress}}</p>
          <p class="metric-value">{{count}} · {{percent}}%</p>
          <progress value="{{percent}}" max="100" aria-labelledby="progress-label">{{percent}}%</progress>
        </div>
      </div>
      <section aria-labelledby="checklist-title">
        <h2 id="checklist-title">{{checklist}}</h2>
        <p class="hint">{{hint}}</p>
        {{sections}}
      </section>
      {{archived}}
    </div>
    {{questions}}
  </div>
  <section class="sources"><h2>{{source_title}}</h2><ul>{{sources}}</ul></section>
  <footer>{{updated}}</footer>
</main>
</body>
</html>
