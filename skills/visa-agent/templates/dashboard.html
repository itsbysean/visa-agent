<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{name}} · {{title}}</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192c3b;background:#f2f5f8;line-height:1.65}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:40px 24px}header{background:#153e52;color:#fff;padding:32px;border-radius:20px}h1{margin:8px 0;font-size:clamp(1.8rem,5vw,2.6rem)}h2{font-size:1.3rem;margin:32px 0 16px}h3{font-size:1.05rem;margin:0}.eyebrow{letter-spacing:.09em;font-size:.85rem}header p{margin:8px 0}progress{display:block;width:100%;height:14px;accent-color:#56d9b7;margin:12px 0}.hint{padding:16px 0;color:#526575}.task{background:white;border:1px solid #dbe3e9;border-left:5px solid #8b9aaa;border-radius:12px;padding:20px;margin:12px 0;break-inside:avoid}.task.done{border-left-color:#168264}.task.needs_review{border-left-color:#be7b0d}.task.in_progress{border-left-color:#316dd9}.task-heading{display:flex;justify-content:space-between;gap:12px;align-items:start}.badge{border-radius:20px;background:#edf2f6;padding:3px 12px;font-size:.8rem;white-space:nowrap}.muted,small{color:#566b7b}.task p{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.citations{font-size:.9rem}a{color:#126486;text-underline-offset:3px;overflow-wrap:anywhere}li{margin:8px 0}footer{margin-top:40px;font-size:.85rem;color:#566b7b}@media(max-width:600px){main{padding:16px}header{padding:24px}.task-heading{flex-direction:column}}@media print{:root{background:white}main{max-width:none;padding:0}header{background:white;color:#192c3b;border:1px solid #dbe3e9}.hint{display:none}a{color:inherit}.task{box-shadow:none}h2{break-after:avoid}}
</style>
</head>
<body><main>
<header><div class="eyebrow">{{title}}</div><h1>{{name}}</h1><p>{{destination}} · {{purpose}}</p><p>{{progress}} · {{count}} · {{percent}}%</p><progress value="{{percent}}" max="100" aria-label="{{progress}}">{{percent}}%</progress></header>
<p class="hint">{{hint}}</p>
{{questions}}
{{sections}}
{{archived}}
<section><h2>{{source_title}}</h2><ul>{{sources}}</ul></section>
<footer>{{updated}}</footer>
</main></body></html>
